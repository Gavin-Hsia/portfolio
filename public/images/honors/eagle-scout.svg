<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80" role="img" aria-label="Scouting fleur-de-lis emblem">
  <g fill="#0f2c52">
    <g transform="translate(32,44)">
      <!-- three petals (center + two angled), tails meeting at the band -->
      <path d="M0 -40 C 8 -22, 10 -10, 0 0 C -10 -10, -8 -22, 0 -40 Z"/>
      <path transform="rotate(-38)" d="M0 -34 C 9 -20, 10 -9, 0 0 C -10 -9, -9 -20, 0 -34 Z"/>
      <path transform="rotate(38)" d="M0 -34 C 9 -20, 10 -9, 0 0 C -10 -9, -9 -20, 0 -34 Z"/>
      <!-- band across the middle -->
      <rect x="-15" y="-5" width="30" height="7" rx="3.5"/>
      <!-- tapering base -->
      <path d="M-7 2 L 7 2 C 7 12, 4 20, 0 26 C -4 20, -7 12, -7 2 Z"/>
    </g>
  </g>
</svg>
