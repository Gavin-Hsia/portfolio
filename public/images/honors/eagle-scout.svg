<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80" role="img" aria-label="Scouting fleur-de-lis emblem in red, white, and blue">
  <g transform="translate(32,44)">
    <!-- red lily: three petals + tapering base -->
    <g fill="#ce1126">
      <path d="M0 -40 C 8 -22, 10 -10, 0 0 C -10 -10, -8 -22, 0 -40 Z"/>
      <path transform="rotate(-38)" d="M0 -34 C 9 -20, 10 -9, 0 0 C -10 -9, -9 -20, 0 -34 Z"/>
      <path transform="rotate(38)" d="M0 -34 C 9 -20, 10 -9, 0 0 C -10 -9, -9 -20, 0 -34 Z"/>
      <path d="M-7 2 L 7 2 C 7 12, 4 20, 0 26 C -4 20, -7 12, -7 2 Z"/>
    </g>
    <!-- navy band across the middle, with two white stars -->
    <rect fill="#0a2a5e" x="-15" y="-5" width="30" height="8" rx="4"/>
    <g fill="#ffffff">
      <circle cx="-8" cy="-1" r="1.7"/>
      <circle cx="0" cy="-1" r="1.7"/>
      <circle cx="8" cy="-1" r="1.7"/>
    </g>
  </g>
</svg>
