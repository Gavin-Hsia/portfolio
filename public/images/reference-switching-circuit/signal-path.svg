<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Reference distribution signal path block diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#101114"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#101114; stroke-width:2; }
      .lbl { font-family:'Inter',system-ui,sans-serif; font-size:22px; fill:#101114; }
      .sub { font-family:'Inter',system-ui,sans-serif; font-size:18px; fill:#6b7280; }
      .wire { fill:none; stroke:#101114; stroke-width:2; }
    </style>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>

  <!-- sources -->
  <rect class="box" x="40" y="66" width="180" height="64" rx="10"/>
  <text class="lbl" x="130" y="105" text-anchor="middle">10 MHz reference</text>
  <rect class="box" x="40" y="250" width="180" height="64" rx="10"/>
  <text class="lbl" x="130" y="289" text-anchor="middle">1PPS reference</text>

  <!-- converging wires into switch -->
  <path class="wire" d="M220 98 H280 V165 H320"/>
  <path class="wire" d="M220 282 H280 V215 H320" marker-end="url(#arrow)"/>
  <path class="wire" d="M320 165 L322 165" marker-end="url(#arrow)"/>

  <!-- analog switch (highlight) -->
  <rect x="320" y="120" width="185" height="140" rx="12" fill="#eef5ff" stroke="#2b8bff" stroke-width="2.5"/>
  <text class="lbl" x="412" y="182" text-anchor="middle" fill="#0b63c4">Analog switch</text>
  <text class="sub" x="412" y="208" text-anchor="middle" fill="#2b8bff">source select</text>

  <!-- chain -->
  <rect class="box" x="560" y="150" width="150" height="80" rx="10"/>
  <text class="lbl" x="635" y="196" text-anchor="middle">Current buffer</text>
  <rect class="box" x="765" y="150" width="150" height="80" rx="10"/>
  <text class="lbl" x="840" y="196" text-anchor="middle">Comparator</text>
  <rect class="box" x="970" y="150" width="190" height="80" rx="10"/>
  <text class="lbl" x="1065" y="188" text-anchor="middle">Reference</text>
  <text class="lbl" x="1065" y="214" text-anchor="middle">output</text>

  <!-- chain arrows -->
  <path class="wire" d="M505 190 H560" marker-end="url(#arrow)"/>
  <path class="wire" d="M710 190 H765" marker-end="url(#arrow)"/>
  <path class="wire" d="M915 190 H970" marker-end="url(#arrow)"/>

  <!-- callout -->
  <path d="M412 260 V300" fill="none" stroke="#2b8bff" stroke-width="1.6" stroke-dasharray="5 5"/>
  <circle cx="412" cy="300" r="3.5" fill="#2b8bff"/>
  <text class="sub" x="412" y="336" text-anchor="middle" fill="#3b3f47">Off-isolation spec: when a channel is off, its input must be strongly</text>
  <text class="sub" x="412" y="360" text-anchor="middle" fill="#3b3f47">attenuated here so it can't bleed into the output.</text>
</svg>
