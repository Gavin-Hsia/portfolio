<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900" role="img" aria-label="Abstract circuit board background">
  <!-- TODO: swap this placeholder for a real hero photo if you have one -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#12203a"/>
      <stop offset="55%" stop-color="#0b0f18"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090d" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#08090d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="circuit" width="200" height="200" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#2f6bb0" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round">
        <path d="M0 40 H70 L90 60 H160 M160 60 V120"/>
        <path d="M40 0 V50 M40 50 L60 70 V140 L80 160 H200"/>
        <path d="M200 30 H150 L130 50 V110"/>
        <path d="M0 150 H50 L70 130 H120"/>
        <path d="M110 200 V170 L130 150 H180 L200 170"/>
        <path d="M0 90 H30 L50 110"/>
      </g>
      <g fill="#4da3ff" fill-opacity="0.55">
        <circle cx="90" cy="60" r="3.2"/>
        <circle cx="160" cy="120" r="3.2"/>
        <circle cx="60" cy="70" r="3.2"/>
        <circle cx="80" cy="160" r="3.2"/>
        <circle cx="130" cy="50" r="3.2"/>
        <circle cx="70" cy="130" r="3.2"/>
        <circle cx="50" cy="110" r="3.2"/>
        <circle cx="130" cy="150" r="3.2"/>
      </g>
      <g fill="none" stroke="#173154" stroke-width="1" stroke-opacity="0.6">
        <rect x="150" y="150" width="34" height="22" rx="2"/>
        <rect x="12" y="60" width="26" height="16" rx="2"/>
      </g>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#circuit)"/>

  <!-- a few brighter accent traces on top -->
  <g fill="none" stroke="#4da3ff" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round">
    <path d="M0 450 H520 L570 500 H900"/>
    <path d="M1600 300 H1180 L1130 350 H820"/>
  </g>
  <g fill="#8cc4ff" fill-opacity="0.9">
    <circle cx="570" cy="500" r="4"/>
    <circle cx="1130" cy="350" r="4"/>
  </g>

  <rect width="1600" height="900" fill="url(#scrim)"/>
</svg>
